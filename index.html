<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>cpal wasm template</title>
    </head>
    <body>
        <div>
            <input id="play" type="button" value="start" />
        </div>
        <div>
            <input id="randomise-matrix" type="button" value="randomise network (matrix weights + channel levels)" />
        </div>
        <div>
            <input id="randomise" type="button" value="randomise sliders" />
        </div>
        <div>
            <label for="integrator">integrator level coefficients</label>
            <input id="integrator" data-param="integrator" type="range" min="0" max="1" step="0.001" value="0" />
            <span id="integrator-value">0</span>
        </div>
        <div>
            <label for="phaser_feedback">phaser feedback</label>
            <input id="phaser_feedback" data-param="phaser_feedback" type="range" min="0" max="1" step="0.001" value="0.75" />
            <span id="phaser_feedback-value">0.75</span>
        </div>
        <div>
            <label for="cross_feedback">cross-channel feedback</label>
            <input id="cross_feedback" data-param="cross_feedback" type="range" min="0" max="1" step="0.001" value="0.75" />
            <span id="cross_feedback-value">0.75</span>
        </div>
        <div>
            <label for="phaser_coefficient_offset">offset phaser coefficients</label>
            <input id="phaser_coefficient_offset" data-param="phaser_coefficient_offset" type="range" min="0" max="1" step="0.001" value="0.5" />
            <span id="phaser_coefficient_offset-value">0.5</span>
        </div>
        <div>
            <label for="drive">drive</label>
            <input id="drive" data-param="drive" type="range" min="0" max="1" step="0.001" value="0.5" />
            <span id="drive-value">0.5</span>
        </div>
        <div>
            <label for="channel_level_offset">channel level offset</label>
            <input id="channel_level_offset" data-param="channel_level_offset" type="range" min="0" max="1" step="0.001" value="0" />
            <span id="channel_level_offset-value">0</span>
        </div>
        <canvas id="scope" width="500" height="500" style="background: #000"></canvas>
    </body>
</html>
