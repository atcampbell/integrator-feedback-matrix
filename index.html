<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>cpal wasm template</title>
    </head>
    <body>
        <div>
            <input id="play" type="button" value="start / randomise matrix levels at full gain" />
            <input id="stop" type="button" value="stop" />
        </div>
        <div>
            <input id="randomise" type="button" value="randomise channel gain" />
        </div>
        <div>
            <label for="dt">dt</label>
            <input id="dt" type="range" min="0.0005" max="0.02" step="0.0005" value="0.01" />
            <span id="dt-value">0.01</span>
        </div>
        <canvas id="scope" width="500" height="500" style="background: #000"></canvas>
    </body>
</html>
